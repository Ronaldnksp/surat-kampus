# nixpacks.toml - PHP Configuration for Railway

[phases.setup]
nixPkgs = ["php", "apacheHttpd", "libpng", "libjpeg", "freetype", "libzip", "icu"]

[phases.install]
cmds = ["apt-get update && apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev libzip-dev libicu-dev"]

[phases.build]
cmds = ["docker-php-ext-configure gd --with-freetype --with-jpeg", "docker-php-ext-install pdo pdo_mysql mysqli gd zip intl", "a2enmod rewrite"]

[start]
cmd = "apache2-foreground"
